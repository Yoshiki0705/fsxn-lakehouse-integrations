AWSTemplateFormatVersion: '2010-09-09'
Description: |
  FPolicy External Server on ECS Fargate.
  ONTAP FPolicy TCP サーバーを Fargate で稼働させる。
  
  重要: ONTAP FPolicy は NLB TCP パススルー経由では動作しない（バイナリフレーミング非互換）。
  ONTAP external-engine には Fargate タスクの直接 Private IP を指定すること。
  NLB はヘルスチェック + サービスディスカバリ用途のみ。
  
  Architecture:
    ONTAP FPolicy → TCP:9898 → ECS Fargate (fpolicy_server.py)
        → SQS Queue → Lambda (Bridge) → SNS Topic → Snowflake SQS (Snowpipe)
  
  Origin: Adapted from FSx-for-ONTAP-S3AccessPoints-Serverless-Patterns
  
  NFS マウント要件:
    - NFSv4.1 でマウント推奨 (mount -o vers=4.1)
    - NFSv3 も動作する (mount -o vers=3)
    - vers=4 は使用禁止（NFSv4.2 にネゴシエートされ FPolicy 非サポート）
  
  IP Updater:
    Fargate タスク再起動時に IP が変わるため、fpolicy-ip-updater.yaml スタックを
    併用して ONTAP external-engine primary-servers を自動更新すること。

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: FPolicy Server を配置する VPC ID（FSx for ONTAP と同一 VPC）

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Fargate タスクを配置する Private Subnet（FSx for ONTAP SVM data LIF と同一サブネット推奨）

  FsxnSvmSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: FSx for ONTAP SVM の Security Group ID（インバウンド許可元）

  SqsQueueUrl:
    Type: String
    Description: FPolicy イベント送信先 SQS Queue URL（fpolicy-ingestion スタックの出力）

  SqsQueueArn:
    Type: String
    Default: ''
    Description: FPolicy イベント送信先 SQS Queue ARN（タスクロール権限用）

  ContainerImage:
    Type: String
    Description: FPolicy Server コンテナイメージ URI（ECR）
    Default: ''

  FPolicyPort:
    Type: Number
    Default: 9898
    Description: FPolicy TCP リスニングポート（ONTAP FPolicy バイナリプロトコル）

  WriteCompleteDelaySec:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 60
    Description: NFSv3 write-complete 待機秒数

  Mode:
    Type: String
    Default: realtime
    AllowedValues: [realtime, batch]
    Description: 動作モード（realtime=即時SQS Push, batch=ログ書き込み）

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 3
    Description: Fargate タスク数

  Cpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024']
    Description: Fargate タスク CPU（256=0.25vCPU）

  Memory:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048']
    Description: Fargate タスクメモリ（MB）

  SvmName:
    Type: String
    Default: FSxN_OnPre
    Description: デフォルト SVM 名

  VolumeName:
    Type: String
    Default: vol1
    Description: デフォルトボリューム名

Conditions:
  HasContainerImage: !Not [!Equals [!Ref ContainerImage, '']]
  HasSqsQueueArn: !Not [!Equals [!Ref SqsQueueArn, '']]

Resources:
  # --- Security Group ---
  FPolicyServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FPolicy External Server - allows TCP from FSx for ONTAP SVM Security Group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref FPolicyPort
          ToPort: !Ref FPolicyPort
          SourceSecurityGroupId: !Ref FsxnSvmSecurityGroupId
          Description: FPolicy TCP from FSx for ONTAP SVM (primary-servers connection)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to SQS/CloudWatch/ECR (via VPC Endpoint or NAT)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-fpolicy-server-sg'

  # --- NLB (health check only — NOT for FPolicy traffic) ---
  FPolicyNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'fp-nlb-${AWS::StackName}'
      Scheme: internal
      Type: network
      Subnets: !Ref SubnetIds
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-fpolicy-nlb'

  FPolicyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'fp-tg-${AWS::StackName}'
      Port: !Ref FPolicyPort
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: TCP
      HealthCheckPort: !Sub '${FPolicyPort}'
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: 'false'

  FPolicyListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref FPolicyNLB
      Port: !Ref FPolicyPort
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FPolicyTargetGroup

  # --- ECS Cluster ---
  FPolicyCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-fpolicy-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # --- CloudWatch Log Group ---
  FPolicyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/fpolicy-server'
      RetentionInDays: 30

  # --- IAM: Task Execution Role ---
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-fpolicy-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # --- IAM: Task Role (SQS send + CloudWatch metrics) ---
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-fpolicy-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FPolicyServerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !If
                    - HasSqsQueueArn
                    - !Ref SqsQueueArn
                    - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: FSx for ONTAP-Lakehouse-Integrations

  # --- ECS Task Definition ---
  FPolicyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasContainerImage
    Properties:
      Family: !Sub '${AWS::StackName}-fpolicy-server'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: fpolicy-server
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref FPolicyPort
              Protocol: tcp
          Environment:
            - Name: FPOLICY_PORT
              Value: !Sub '${FPolicyPort}'
            - Name: SQS_QUEUE_URL
              Value: !Ref SqsQueueUrl
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: MODE
              Value: !Ref Mode
            - Name: WRITE_COMPLETE_DELAY_SEC
              Value: !Sub '${WriteCompleteDelaySec}'
            - Name: SVM_NAME
              Value: !Ref SvmName
            - Name: VOLUME_NAME
              Value: !Ref VolumeName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FPolicyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fpolicy-server
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'python -c "import socket; s=socket.socket(); s.settimeout(2); s.connect((''localhost'', ${FPolicyPort})); s.close()"'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10

  # --- ECS Service ---
  FPolicyService:
    Type: AWS::ECS::Service
    Condition: HasContainerImage
    DependsOn: FPolicyListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-fpolicy-service'
      Cluster: !Ref FPolicyCluster
      TaskDefinition: !Ref FPolicyTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref FPolicyServerSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: fpolicy-server
          ContainerPort: !Ref FPolicyPort
          TargetGroupArn: !Ref FPolicyTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      EnableExecuteCommand: true

Outputs:
  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt FPolicyCluster.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ClusterArn'

  ServiceName:
    Description: ECS Service Name (fpolicy-ip-updater スタックで使用)
    Value: !If
      - HasContainerImage
      - !Sub '${AWS::StackName}-fpolicy-service'
      - ''
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'

  SecurityGroupId:
    Description: FPolicy Server Security Group ID
    Value: !Ref FPolicyServerSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'

  NLBDnsName:
    Description: |
      NLB DNS 名（ヘルスチェック用のみ）。
      重要: ONTAP external-engine には NLB IP ではなく Fargate タスクの直接 IP を使用すること。
    Value: !GetAtt FPolicyNLB.DNSName

  LogGroupName:
    Description: CloudWatch Log Group for FPolicy server logs
    Value: !Ref FPolicyLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupName'

  GetTaskIPCommand:
    Description: Fargate タスク IP 取得コマンド（ONTAP external-engine primary-servers に設定）
    Value: !Sub |
      TASK_ARN=$(aws ecs list-tasks --cluster ${AWS::StackName}-fpolicy-cluster --desired-status RUNNING --query 'taskArns[0]' --output text)
      aws ecs describe-tasks --cluster ${AWS::StackName}-fpolicy-cluster --tasks $TASK_ARN --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value' --output text

  OntapExternalEngineCommand:
    Description: |
      ONTAP FPolicy external-engine 作成コマンド。
      <FARGATE_TASK_IP> を GetTaskIPCommand の出力で置換すること。
      IP Updater Lambda (fpolicy-ip-updater.yaml) がタスク再起動時に自動更新する。
    Value: !Sub |
      fpolicy policy external-engine create \
        -vserver ${SvmName} \
        -engine-name fpolicy_lakehouse_engine \
        -primary-servers <FARGATE_TASK_IP> \
        -port ${FPolicyPort} \
        -extern-engine-type asynchronous
