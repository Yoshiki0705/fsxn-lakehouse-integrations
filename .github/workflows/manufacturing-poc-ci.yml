name: Manufacturing PoC CI

on:
  push:
    paths:
      - 'integrations/manufacturing-data-platform/poc/**'
      - '.github/workflows/manufacturing-poc-ci.yml'
  pull_request:
    paths:
      - 'integrations/manufacturing-data-platform/poc/**'

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/manufacturing-data-platform/poc/synthetic-data-generator

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pinned exactly. These were unpinned, and ruff 0.16.1 widened its default
          # rule set enough to fail code that had passed since 2026-07-22 with no
          # change to the code. The rule set itself is declared in ruff.toml, so
          # neither the tool version nor the rules can now drift on their own.
          pip install "pytest==9.1.1" "ruff==0.16.1" "mypy==2.3.0"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      # The Databricks notebooks were outside the lint scope entirely, because this
      # job's working-directory is the generator. They now carry their own ruff.toml
      # declaring the runtime-injected globals, so they can be checked here.
      # check only, not format: see the note in that ruff.toml for why.
      - name: Lint Databricks notebooks with ruff
        working-directory: integrations/manufacturing-data-platform/poc/databricks
        run: ruff check .

      - name: Type check with mypy
        run: mypy generate_events.py --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Advisory for PoC

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Dry-run event generator
        run: python generate_events.py --dry-run

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check bilingual doc sync (file existence)
        run: |
          cd integrations/manufacturing-data-platform/docs
          echo "Checking en/ja document parity..."
          for f in en/*.md; do
            basename=$(basename "$f")
            if [ ! -f "ja/$basename" ]; then
              echo "ERROR: Missing Japanese version: ja/$basename"
              exit 1
            fi
          done
          echo "All English docs have Japanese counterparts ✅"
