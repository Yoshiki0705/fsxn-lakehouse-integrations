tests:
  - id: "NEG-001"
    description: "Write attempt by read-only file system user (nobody)"
    severity: "Critical"
    command: "aws s3 cp /tmp/sensor_data.parquet s3://verification-rea-...-ext-s3alias/write-test.parquet"
    expected_result: "AccessDenied"
    actual_result: "AccessDenied"
    passed: true
    denial_layer: "file_system_user"
    cloudtrail_event_id: ""  # To be captured
    notes: "nobody user cannot write to root-owned directory. File system permission layer correctly denies."

  - id: "NEG-002"
    description: "Delete attempt by read-only file system user (nobody)"
    severity: "Critical"
    command: "aws s3api delete-object --bucket verification-rea-...-ext-s3alias --key sensor-data/sensor_data.parquet"
    expected_result: "AccessDenied"
    actual_result: "Success (200)"
    passed: false
    denial_layer: "N/A - not denied"
    cloudtrail_event_id: ""
    notes: |
      UNEXPECTED: DeleteObject succeeded for nobody user.
      Root cause: In ONTAP UNIX security model, file deletion depends on parent directory
      write permission (w bit on directory), not file ownership. The root-created directory
      may have permissions that allow nobody to delete files within it.
      This is a KNOWN BEHAVIOR of UNIX filesystems, not a bug in S3 AP.
      MITIGATION: Set parent directory permissions to 755 (drwxr-xr-x) to prevent
      non-owner deletion. Or use a dedicated read-only AP with IAM policy restricting
      DeleteObject action.

