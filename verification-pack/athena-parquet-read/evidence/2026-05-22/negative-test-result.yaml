tests:
  - id: "NEG-001"
    description: "Write attempt by read-only file system user (nobody)"
    severity: "Critical"
    command: "aws s3 cp /tmp/sensor_data.parquet s3://verification-rea-...-ext-s3alias/write-test.parquet"
    expected_result: "AccessDenied"
    actual_result: "AccessDenied"
    passed: true
    denial_layer: "file_system_user"
    cloudtrail_event_id: ""  # To be captured
    notes: "nobody user cannot write to root-owned directory. File system permission layer correctly denies."

  - id: "NEG-002"
    description: "Delete attempt by read-only file system user (nobody) - WITH AP policy Deny"
    severity: "Critical"
    command: "aws s3api delete-object --bucket verification-rea-...-ext-s3alias --key sensor-data/sensor_data.parquet"
    expected_result: "AccessDenied"
    actual_result: "AccessDenied (explicit deny in a resource-based policy)"
    passed: true
    denial_layer: "AP_policy"
    cloudtrail_event_id: ""
    notes: |
      INITIAL TEST: DeleteObject succeeded for nobody user (UNIX dir permission model).
      MITIGATION APPLIED: Added explicit Deny for PutObject/DeleteObject in AP policy.
      RETEST: AccessDenied correctly returned.
      LESSON: File system user permissions alone do NOT prevent deletion in ONTAP
      (delete depends on parent directory write permission). AP policy Deny is required
      for true read-only enforcement.

  - id: "NEG-003"
    description: "Cross-account access without explicit grant"
    severity: "Critical"
    command: "N/A - requires second AWS account"
    expected_result: "AccessDenied"
    actual_result: "NOT TESTED"
    passed: false
    denial_layer: "N/A"
    cloudtrail_event_id: ""
    notes: "Requires a second AWS account to test. Skipped in this round."

  - id: "NEG-004"
    description: "Access VPC-origin AP from outside VPC (internet/local machine)"
    severity: "Critical"
    command: "aws s3api list-objects-v2 --bucket verification-vpc-jhm1khztfyat85bj4zrdkfo7i91khapn1b-ext-s3alias --max-keys 2 --region ap-northeast-1"
    expected_result: "AccessDenied"
    actual_result: "AccessDenied: not authorized to perform s3:ListBucket with an explicit deny in a resource-based policy"
    passed: true
    denial_layer: "VPC_condition (VPC-origin enforcement acts as implicit explicit Deny)"
    cloudtrail_event_id: ""
    notes: |
      Created VPC-origin AP (verification-vpc-origin-ap) bound to vpc-0ae01826f906191af.
      Tested from local machine (outside VPC).
      Result: AccessDenied with "explicit deny in a resource-based policy".
      Control test: Same volume's Internet-origin AP (verification-test-ap) succeeds from same location.
      This confirms VPC-origin enforcement works as documented:
      requests not arriving through a VPC endpoint in the bound VPC are denied
      before any policy evaluation occurs.

  - id: "NEG-005"
    description: "PutObject exceeding 5 GB limit"
    severity: "High"
    command: "aws s3 cp 5.1GB-file s3://verification-tes-...-ext-s3alias/large-file.bin"
    expected_result: "EntityTooLarge"
    actual_result: "EntityTooLarge (CompleteMultipartUpload)"
    passed: true
    denial_layer: "S3_AP_limitation"
    cloudtrail_event_id: ""
    notes: "5.1GB file upload correctly rejected with EntityTooLarge error during CompleteMultipartUpload."

  - id: "NEG-006"
    description: "Presigned URL generation and access"
    severity: "Medium"
    command: "aws s3 presign s3://...; curl <presigned-url>"
    expected_result: "Not supported (per AWS docs)"
    actual_result: "URL generated successfully; HTTP 200 on access"
    passed: true  # Updated: AWS Support confirmed this is expected behavior
    denial_layer: "N/A - presigning is client-side; GetObject is supported"
    cloudtrail_event_id: ""
    notes: |
      AWS Support Case 177943289700029 clarified:
      Presigning is NOT an S3 API operation - it is a client-side SigV4 calculation.
      The presigned URL results in a standard GetObject request (which IS supported).
      It is structurally impossible to block presigning without breaking GetObject.
      However, AWS lists as "Not supported" meaning: not officially tested, no guarantees,
      may fail for unsupported features (encryption params, versioning params).
      RECOMMENDATION: Do not rely on for production. Design alternatives.

  - id: "NEG-007"
    description: "Object Versioning operations (ListObjectVersions)"
    severity: "Medium"
    command: "aws s3api list-object-versions --bucket verification-tes-...-ext-s3alias"
    expected_result: "Not supported (per AWS docs)"
    actual_result: "Returns results with VersionId=null"
    passed: true  # Updated: AWS Support confirmed this is expected for non-versioned storage
    denial_layer: "N/A - trivially answerable from filesystem enumeration"
    cloudtrail_event_id: ""
    notes: |
      AWS Support Case 177943289700029 clarified:
      For non-versioned storage, ListObjectVersions returns objects with VersionId="null".
      This is standard S3 behavior for never-versioned buckets.
      No versioning-specific logic is required - same underlying enumeration as ListObjectsV2.
      Unlike conditional writes (which require extra server logic and return NotImplemented),
      ListObjectVersions succeeds because there is nothing extra to disable.
      However, AWS lists as "Not supported" - behavior may change without notice.
      RECOMMENDATION: Use ListObjectsV2 instead. Do not rely on ListObjectVersions.

  - id: "NEG-008"
    description: "Access after IAM role policy revocation (role removed from AP policy)"
    severity: "Critical"
    command: "# Remove role from AP policy, then assume role and ListObjectsV2"
    expected_result: "AccessDenied"
    actual_result: "AccessDenied (not authorized to perform s3:ListBucket)"
    passed: true
    denial_layer: "AP_policy (role not listed as allowed principal)"
    cloudtrail_event_id: ""
    notes: |
      Test procedure:
      1. Created test role (fsxn-neg008-test-role) with S3 AP read policy
      2. Verified access succeeds (ListObjectsV2 returns KeyCount=2)
      3. Removed role's identity policy → access still succeeds (AP policy allows account root)
      4. Removed role from AP policy → AccessDenied correctly returned
      KEY INSIGHT: For same-account access, EITHER AP policy OR identity policy can grant.
      To truly revoke, must remove from BOTH, or use explicit Deny in AP policy.

  - id: "NEG-009"
    description: "Access from non-bound VPC (VPC-origin AP) - same test as NEG-004"
    severity: "Critical"
    command: "Same as NEG-004 (local machine is outside bound VPC)"
    expected_result: "AccessDenied"
    actual_result: "AccessDenied (same as NEG-004)"
    passed: true
    denial_layer: "VPC_condition"
    cloudtrail_event_id: ""
    notes: "Covered by NEG-004 test. Local machine is outside the bound VPC (vpc-0ae01826f906191af)."

  - id: "NEG-010"
    description: "Conditional write (If-None-Match)"
    severity: "Medium"
    command: "aws s3api put-object --bucket ... --key ... --body ... --if-none-match '*'"
    expected_result: "Not supported"
    actual_result: "NotImplemented: A header you provided implies functionality that is not implemented"
    passed: true
    denial_layer: "S3_AP_limitation"
    cloudtrail_event_id: ""
    notes: "Conditional writes correctly rejected with NotImplemented error."

