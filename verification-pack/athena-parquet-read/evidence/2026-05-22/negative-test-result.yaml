  - id: "NEG-006"
    description: "Presigned URL generation and access"
    severity: "Medium"
    command: "aws s3 presign s3://...; curl <presigned-url>"
    expected_result: "Not supported (per AWS docs)"
    actual_result: "URL generated successfully; HTTP 200 on access"
    passed: false
    denial_layer: "N/A - not denied"
    cloudtrail_event_id: ""
    notes: |
      UNEXPECTED: AWS documentation states Presigned URLs are "Not supported" for
      FSx S3 AP, but actual testing shows:
      1. aws s3 presign generates a valid URL (client-side operation)
      2. curl to the presigned URL returns HTTP 200 with file content
      This may be undocumented/unsupported behavior that works but is not guaranteed.
      RECOMMENDATION: Do not rely on presigned URLs in production designs.

  - id: "NEG-007"
    description: "Object Versioning operations (ListObjectVersions)"
    severity: "Medium"
