# ---------------------------------------------------------------------------
# Conclusion
# ---------------------------------------------------------------------------
conclusion:
  aws_side_verdict: "PASS with defects"
  summary: |
    The AWS-side mechanics of Pattern A work: an object written to the
    FSx for ONTAP S3 Access Point is detected by ListObjectsV2 and a
    notification reaches SNS in about 2 seconds once the poller runs. Access
    Point ARN and alias addressing both function, and IAM granted on the ARN
    covers alias-addressed requests.

    However, the published artifacts cannot be deployed as-is: the
    CloudFormation template ships a placeholder function (DEFECT-1), and the
    only checkpoint mode reachable through that template loses any object that
    ages past the polling window (DEFECT-2, reproduced). The synthesized
    notification also diverges from the real S3 event schema in ways that
    plausibly prevent Snowpipe from matching it to a stage (DEFECT-3, DEFECT-4).
  overall_pattern_a_verdict: "STILL UNVERIFIED end-to-end"
  deciding_unknown: |
    Whether Snowflake accepts a synthesized notification on the pipe's
    notification_channel and triggers COPY. Until that is tested, Pattern A
    should not be presented as a working path.
  recommended_path_meanwhile: |
    Snowflake Task + COPY INTO. COPY INTO from an FSx for ONTAP S3 AP stage
    configured with AWS_ACCESS_POINT_ARN is already verified
    (verification-pack/snowflake/evidence/2026-05-24), it needs no synthesized
    notification, and Snowflake's own load history provides the
    exactly-once behaviour that the poller's time window does not.
  caveats:
    - "Single environment, single day, single file system."
    - "Lambda ran outside the VPC against an Internet-origin Access Point."
    - "Object counts were small; behaviour under high write rates is untested."
    - "The EventBridge schedule leg was not exercised; the Lambda was invoked directly."
