AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Snowflake Storage Integration — IAM Role for FSx for ONTAP S3 Access Point.
  
  Creates an IAM Role that Snowflake assumes via Storage Integration to access
  FSxN volumes through S3 Access Points.
  
  IMPORTANT: FSxN S3 Access Points are NOT created by this template.
  They are created separately using:
    aws fsx create-and-attach-s3-access-point --name <name> --type ONTAP \
      --ontap-configuration VolumeId=<vol-id>,FileSystemIdentity='{...}'
  
  Note: Network origin should be Internet (no VpcConfiguration) for Snowflake
  access, since Snowflake is a SaaS platform outside customer VPCs.
  
  This template handles ONLY the IAM Role with two-phase trust setup:
    Phase 1: Deploy with own-account trust placeholder
    Phase 2: After DESCRIBE INTEGRATION, update with actual Snowflake trust info

Parameters:
  EnvironmentName:
    Type: String
    Default: fsxn-lakehouse
    Description: Environment name prefix for resource naming

  S3AccessPointArn:
    Type: String
    Description: >
      ARN of the existing FSxN S3 Access Point.
      Created via: aws fsx create-and-attach-s3-access-point
      Example: arn:aws:s3:ap-northeast-1:123456789012:accesspoint/snowflake-test

  S3AccessPointAlias:
    Type: String
    Default: ''
    Description: >
      Alias of the FSxN S3 Access Point (for documentation/outputs only).
      Example: snowflake-test-3xzg4g6nsqexwwm1xtbt1bt637f7napn1a-ext-s3alias

  SnowflakeAccountId:
    Type: String
    Default: ''
    Description: >
      Snowflake's AWS Account ID for cross-account trust.
      Leave empty for Phase 1 (uses own account as placeholder).
      After DESCRIBE INTEGRATION, set to STORAGE_AWS_IAM_USER_ARN account portion.

  SnowflakeExternalId:
    Type: String
    Default: 'snowflake-placeholder'
    Description: >
      External ID for IAM role trust (prevents confused deputy attacks).
      Phase 1: placeholder value (own-account trust, ExternalId ignored).
      Phase 2: set to STORAGE_AWS_EXTERNAL_ID from DESCRIBE INTEGRATION output.

  EnableSnowpipe:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to create SNS Topic for Snowpipe auto-ingest

  SnowflakeSqsArn:
    Type: String
    Default: ''
    Description: >
      Snowflake SQS ARN for Snowpipe notifications.
      Obtain from SHOW PIPES output (notification_channel).

Conditions:
  CreateSnowpipe: !Equals [!Ref EnableSnowpipe, 'true']
  HasSnowflakeAccount: !Not [!Equals [!Ref SnowflakeAccountId, '']]
  HasSnowflakeSqs: !Not [!Equals [!Ref SnowflakeSqsArn, '']]

Resources:
  # ============================================================
  # IAM Role for Snowflake Storage Integration
  # ============================================================
  # Two-phase trust policy:
  #   Phase 1: Own-account trust (placeholder) — allows initial deployment
  #   Phase 2: Snowflake account trust + External ID — after DESCRIBE INTEGRATION
  #
  # Snowflake assumes this role via STS to access FSxN S3 Access Point.
  # The S3 AP itself is created separately via aws fsx CLI/API.
  SnowflakeS3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-snowflake-s3-role'
      Description: >
        IAM Role assumed by Snowflake Storage Integration to access FSxN via S3 AP.
        Trust policy updated after DESCRIBE INTEGRATION provides Snowflake account info.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnowflakeAssumeRole
            Effect: Allow
            Principal:
              AWS: !If
                - HasSnowflakeAccount
                - !Sub 'arn:aws:iam::${SnowflakeAccountId}:root'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
            Condition: !If
              - HasSnowflakeAccount
              - StringEquals:
                  'sts:ExternalId': !Ref SnowflakeExternalId
              - !Ref 'AWS::NoValue'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-snowflake-s3-role'
        - Key: Project
          Value: fsxn-lakehouse-integrations
        - Key: Integration
          Value: snowflake

  # ============================================================
  # IAM Policy for S3 AP Access
  # ============================================================
  # Grants read/write access to the FSxN S3 Access Point.
  # FSxN S3 APs use standard S3 API operations.
  SnowflakeS3AccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-snowflake-s3ap-access'
      Roles:
        - !Ref SnowflakeS3AccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3APReadWrite
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
            Resource:
              - !Ref S3AccessPointArn
              - !Sub '${S3AccessPointArn}/object/*'

  # ============================================================
  # SNS Topic for Snowpipe Auto-Ingest (Optional)
  # ============================================================
  SnowpipeSNSTopic:
    Type: AWS::SNS::Topic
    Condition: CreateSnowpipe
    Properties:
      TopicName: !Sub '${EnvironmentName}-snowpipe-notifications'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-snowpipe-notifications'
        - Key: Project
          Value: fsxn-lakehouse-integrations
        - Key: Integration
          Value: snowflake

  SnowpipeSNSPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateSnowpipe
    Properties:
      Topics:
        - !Ref SnowpipeSNSTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnowflakeSubscribe
            Effect: Allow
            Principal:
              AWS: !If
                - HasSnowflakeAccount
                - !Sub 'arn:aws:iam::${SnowflakeAccountId}:root'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - 'sns:Subscribe'
              - 'sns:Receive'
            Resource: !Ref SnowpipeSNSTopic
          - !If
            - HasSnowflakeSqs
            - Sid: AllowSnowflakeSqsSubscribe
              Effect: Allow
              Principal:
                Service: sqs.amazonaws.com
              Action: 'sns:Subscribe'
              Resource: !Ref SnowpipeSNSTopic
              Condition:
                ArnEquals:
                  'aws:SourceArn': !Ref SnowflakeSqsArn
            - !Ref 'AWS::NoValue'

Outputs:
  IAMRoleArn:
    Description: >
      IAM Role ARN for Snowflake Storage Integration.
      Use in: CREATE STORAGE INTEGRATION ... STORAGE_AWS_ROLE_ARN = '<this value>'
    Value: !GetAtt SnowflakeS3AccessRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-SnowflakeRoleArn'

  S3AccessPointArn:
    Description: S3 Access Point ARN (passed as parameter, echoed for reference)
    Value: !Ref S3AccessPointArn

  S3AccessPointAlias:
    Description: S3 Access Point Alias (for STORAGE_ALLOWED_LOCATIONS)
    Value: !Ref S3AccessPointAlias

  StorageAllowedLocations:
    Description: >
      STORAGE_ALLOWED_LOCATIONS for Snowflake Storage Integration.
      Since FSxN S3 AP maps to a single volume root, use the AP alias directly.
    Value: !Sub 's3://${S3AccessPointAlias}/'

  TrustPolicyPhase:
    Description: >
      Current trust policy phase.
      Phase 1: SnowflakeAccountId is empty — own-account trust.
      Phase 2: SnowflakeAccountId set — Snowflake cross-account trust with External ID.
    Value: !If
      - HasSnowflakeAccount
      - 'Phase 2: Snowflake cross-account trust (production)'
      - 'Phase 1: Own-account trust (placeholder — run DESCRIBE INTEGRATION to get Snowflake account info)'

  SnowpipeSNSTopicArn:
    Condition: CreateSnowpipe
    Description: SNS Topic ARN for Snowpipe notifications
    Value: !Ref SnowpipeSNSTopic
