verification_metadata:
  date: "2026-06-18"
  environment: "Local CLI (boto3 / AWS CLI) — no Databricks workspace, no ClickHouse Cloud"
  region: "ap-northeast-1"
  account: "<ACCOUNT-ID>"            # redacted for committable record
  principal: "iam-user (yoshiki0705)"
  evidence_tier: "Verified (read-only gate check)"
  scope: "Gate / prerequisite checks only. No provisioning. No SG/IAM/UC changes."

# ---------------------------------------------------------------------------
# Track A — ClickHouse DataLakeCatalog (Beta) -> Unity Catalog
# ---------------------------------------------------------------------------
track_a_clickhouse_uc:
  overall_status: "BLOCKED"
  gates:
    - gate: "ClickHouse client / ClickHouse Cloud access"
      required: "ClickHouse Cloud version+region supporting DataLakeCatalog (catalog_type='unity', Beta)"
      observed: "clickhouse-client NOT installed locally; no ClickHouse env vars; no ClickHouse Cloud credentials"
      status: "NOT MET"
    - gate: "Databricks UC external data access enabled (CN-B3)"
      required: "Metastore external data access ON + credential vending"
      observed: "Cannot verify — no Databricks workspace access"
      status: "NOT MET (unverifiable)"
    - gate: "Auth principal + UC grants (SELECT + EXTERNAL USE SCHEMA)"
      required: "Service principal or PAT with grants"
      observed: "databricks CLI NOT installed; no Databricks env vars; no PAT"
      status: "NOT MET"
  phases_executed:
    A0: "Gate check — BLOCKED (see gates above)"
    A1_A6: "NOT STARTED (blocked at A0)"
  conclusion: >
    Track A cannot be executed in this environment. Requires (1) ClickHouse Cloud
    credentials with DataLakeCatalog Beta enabled, and (2) Databricks workspace
