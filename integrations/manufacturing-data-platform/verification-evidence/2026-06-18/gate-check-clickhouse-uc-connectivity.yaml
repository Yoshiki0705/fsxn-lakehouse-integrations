# ---------------------------------------------------------------------------
# Track B — Network (NCC / SG / VPC Endpoint)
# ---------------------------------------------------------------------------
track_b_network:
  overall_status: "PARTIAL (grounding only; no connectivity test executed)"
  gates:
    - gate: "Databricks serverless workspace + account CLI"
      required: "databricks account CLI auth to create/assign NCC; serverless compute"
      observed: "databricks CLI NOT installed; no Databricks account auth"
      status: "NOT MET"
    - gate: "SG / endpoint modification permission"
      required: "ec2:AuthorizeSecurityGroupIngress on MSK broker SG, etc."
      observed: "Not exercised (no SG change attempted — requires Databricks egress CIDR which is unavailable)"
      status: "NOT EXERCISED"
  read_only_grounding:
    aws_caller_identity:
      verified: true
      account: "<ACCOUNT-ID>"
      region: "ap-northeast-1"
    msk_cluster:
      verified: true
      note: "Existing provisioned MSK cluster present — Track B Kafka source does NOT need to be built."
      name: "<MSK-CLUSTER-NAME>"        # redacted (existing PoC cluster)
      state: "ACTIVE"
      type: "PROVISIONED"
      kafka_version: "3.6.0"
      broker_count: 2
      auth:
        sasl_iam: true
        sasl_scram: true
        tls_mutual_auth: false
        unauthenticated: false
      public_access: "DISABLED"          # brokers are private (VPC-only)
      encryption_in_transit_client_broker: "TLS"
      private_ports_reference: "IAM 9098 / SCRAM 9096 / TLS 9094 (per MSK port-info)"
    s3_gateway_vpc_endpoints:
      verified: true
      service: "com.amazonaws.ap-northeast-1.s3"
      type: "Gateway"
      count: 5
      all_available: true
      ids: "<VPCE-IDS-REDACTED>"         # 5 endpoints across 5 VPCs (account-specific IDs withheld)
  phases_executed:
    B0: "Gate check — Databricks gate NOT MET; MSK + S3 endpoints grounded (read-only)"
    B1: "NOT STARTED (needs Databricks serverless workspace + NCC)"
    B2: "PARTIAL — S3 Gateway endpoints confirmed to exist; ClickHouse->S3 routing NOT tested (no ClickHouse instance)"
    B3: "NOT RUN — broker ports are private; this host is outside the MSK VPC, so 'nc -zv' to private brokers is not meaningful"
    B4: "N/A (no changes made; nothing to clean up)"
  conclusion: >
    Track B network grounding is confirmed (MSK cluster active with SASL/IAM+SCRAM,
    private-only, TLS in transit; 5 S3 Gateway endpoints available). However, the
    actual private-path connectivity test (Kafka -> Databricks via NCC, and
    ClickHouse -> S3 via endpoint) cannot be executed without a Databricks
    serverless workspace and (for B2) a ClickHouse instance inside the VPC.

# ---------------------------------------------------------------------------
# What is needed to unblock (handed back to operator)
# ---------------------------------------------------------------------------
unblock_requirements:
  track_a:
    - "ClickHouse Cloud: API/SQL access with DataLakeCatalog (unity, Beta) enabled in a supported version/region"
    - "Databricks: workspace URL + token (or service principal); install databricks CLI; enable UC external data access"
  track_b:
    - "Databricks serverless workspace + account-level CLI auth (for NCC create/assign)"
    - "Databricks stable egress CIDR (to author the MSK broker SG ingress rule for port 9098)"
    - "For B2 self-managed ClickHouse path: an EC2/compute inside a VPC with the S3 Gateway endpoint"

safety_notes:
  - "Only read-only describe/list calls were made (sts, kafka list/describe, ec2 describe-vpc-endpoints)."
  - "No security groups modified. No NCC/PrivateLink created. No UC/ClickHouse objects created."
  - "No billable resources provisioned during this gate check."

next_steps:
  - "Operator to provide ClickHouse Cloud + Databricks credentials, or confirm a contained subset to run."
  - "Once credentials exist: execute Track A (A1->A6) and Track B (B1->B4) per the plan, recording per-phase YAML here."
  - "Beta features (DataLakeCatalog, UC external data access) -> production decision deferred until GA."
