AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Manufacturing Data Platform PoC — VPC and Network Foundation
  Creates VPC, subnets, security groups, and VPC endpoints for all PoC components.
  
  Architecture Reference: DES-008 (Network Architecture)
  SYNTHETIC PoC infrastructure — not for production use.

Parameters:
  Environment:
    Type: String
    Default: poc
    AllowedValues: [poc, dev]
  
  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: VPC CIDR block

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First AZ for subnets

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second AZ for subnets

Resources:

  # --- VPC ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-vpc'
        - Key: Project
          Value: manufacturing-data-platform-poc

  # --- Subnets (Private only — no public subnets for PoC) ---
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.1.0/24'
      AvailabilityZone: !Ref AvailabilityZone1
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.2.0/24'
      AvailabilityZone: !Ref AvailabilityZone2
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-private-2'

  # --- Route Table (private — no internet gateway) ---
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-private-rt'

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # --- VPC Endpoints (Gateway — no cost) ---
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # --- VPC Endpoints (Interface — for STS, needed by MSK IAM auth) ---
  STSVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true

  # --- Security Groups ---
  
  # VPC Endpoint SG
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from VPC for VPC endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS from VPC
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-vpce-sg'

  # MSK Security Group
  MSKSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MSK Kafka broker access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9098
          ToPort: 9098
          CidrIp: !Ref VpcCidr
          Description: Kafka IAM auth from VPC
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-msk-sg'

  # FSx for ONTAP Security Group
  FSxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FSx for ONTAP access (NFS, SMB, ONTAP S3, management)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: !Ref VpcCidr
          Description: NFS
        - IpProtocol: tcp
          FromPort: 111
          ToPort: 111
          CidrIp: !Ref VpcCidr
          Description: NFS portmapper
        - IpProtocol: tcp
          FromPort: 445
          ToPort: 445
          CidrIp: !Ref VpcCidr
          Description: SMB
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: ONTAP S3 and management HTTPS
        - IpProtocol: tcp
          FromPort: 635
          ToPort: 635
          CidrIp: !Ref VpcCidr
          Description: NFS mount
        - IpProtocol: tcp
          FromPort: 4046
          ToPort: 4046
          CidrIp: !Ref VpcCidr
          Description: NFS lock daemon
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: !Ref VpcCidr
          Description: ICMP ping
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-fsx-sg'

  # General workload Security Group (ClickHouse, Databricks connectivity)
  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: General workload access (ClickHouse, compute)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref VpcCidr
          Description: ClickHouse HTTPS
        - IpProtocol: tcp
          FromPort: 9440
          ToPort: 9440
          CidrIp: !Ref VpcCidr
          Description: ClickHouse native TLS
      Tags:
        - Key: Name
          Value: !Sub 'manufacturing-${Environment}-workload-sg'

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet1Id'

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2Id'

  MSKSecurityGroupId:
    Description: MSK Security Group ID
    Value: !Ref MSKSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-MSKSecurityGroupId'

  FSxSecurityGroupId:
    Description: FSx for ONTAP Security Group ID
    Value: !Ref FSxSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-FSxSecurityGroupId'

  WorkloadSecurityGroupId:
    Description: Workload Security Group ID
    Value: !Ref WorkloadSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-WorkloadSecurityGroupId'

  VpcCidrOutput:
    Description: VPC CIDR
    Value: !Ref VpcCidr
    Export:
      Name: !Sub '${AWS::StackName}-VpcCidr'
