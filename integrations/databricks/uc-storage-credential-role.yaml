AWSTemplateFormatVersion: '2010-09-09'

Description: >
  IAM role for a Databricks Unity Catalog storage credential pointing at an
  FSx for ONTAP S3 Access Point, plus an optional native S3 bucket to use as a
  control. Creating the external location on the Access Point succeeds; reading
  through it is currently denied by Unity Catalog's down-scoped session policy
  (BLK-001). The control bucket is what makes that result interpretable.

# ---------------------------------------------------------------------------
# Read this before filling in parameters
# ---------------------------------------------------------------------------
# Two settings decide whether you get a working registration or a 403 that
# looks like "S3 Access Points are unsupported". Both were found by measurement
# on 2026-08-12:
#
#   1. The storage credential's external ID is the Databricks ACCOUNT UUID.
#      It is not the metastore ID. Using the metastore ID yields
#      403 Forbidden from the storage provider.
#
#   2. The permission policy must reference the ACCESS POINT ARN
#      (arn:aws:s3:<region>:<account>:accesspoint/<name> and .../object/*).
#      Granting only the alias-as-bucket ARN yields AccessDeniedException,
#      even though the alias form works from the AWS CLI. This template grants
#      both forms, because different call paths present the resource
#      differently and there is no cost to covering both.
#
# Note the asymmetry that follows from this: the external location URL must use
# the ALIAS form (s3://<alias>/). The ARN-style URL is rejected with
# "url does not specify a valid bucket name". The IAM policy wants the ARN form.
# Two places, two spellings of the same access point.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Databricks account
        Parameters:
          - DatabricksAccountId
          - DatabricksUnityCatalogAwsAccountId
      - Label:
          default: FSx for ONTAP S3 Access Point
        Parameters:
          - S3AccessPointName
          - S3AccessPointAlias
      - Label:
          default: Naming and options
        Parameters:
          - RoleName
          - CreateControlBucket
          - ControlBucketName
    ParameterLabels:
      DatabricksAccountId:
        default: Databricks account UUID (this is the external ID)
      DatabricksUnityCatalogAwsAccountId:
        default: Databricks AWS account that assumes the role
      S3AccessPointName:
        default: Access Point name
      S3AccessPointAlias:
        default: Access Point alias
      RoleName:
        default: IAM role name
      CreateControlBucket:
        default: Create a native S3 control bucket

Parameters:

  DatabricksAccountId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    Description: >
      Your Databricks account UUID, used as the sts:ExternalId. Find it in the
      Databricks account console URL as account_id=..., or under the account
      settings page. This is NOT the metastore ID and NOT the workspace ID -
      using either of those produces a 403 that is easy to misread as the
      Access Point being unsupported.
    ConstraintDescription: Must be a UUID, for example 11111111-2222-3333-4444-555555555555

  DatabricksUnityCatalogAwsAccountId:
    Type: String
    Default: '414351767826'
    AllowedPattern: '^[0-9]{12}$'
    Description: >
      The AWS account Databricks assumes this role from. 414351767826 is the
      value observed for the AWS (commercial) control plane in 2026-08; it also
      appears as the "Requestor identifier" on the IAM temporary-delegation
      review screen and as the trust principal of the workspace compute role.
      Confirm it against current Databricks documentation before relying on it -
      an account ID baked into a template is exactly the kind of value that goes
      stale quietly.

  S3AccessPointName:
    Type: String
    MinLength: 1
    Description: >
      The name of the FSx for ONTAP S3 Access Point, for example
      analytics-readonly-ap. Used to build the access point ARN.
      List them with:
        aws fsx describe-s3-access-point-attachments --region <region>

  S3AccessPointAlias:
    Type: String
    MinLength: 1
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*-s3alias$'
    Description: >
      The alias of the same Access Point, ending in -s3alias. This is what
      Unity Catalog and the S3 API address as if it were a bucket name.
      Same describe command as above; the field is S3AccessPoint.Alias.
    ConstraintDescription: Must be an Access Point alias ending in -s3alias

  RoleName:
    Type: String
    Default: databricks-uc-fsxn-s3ap
    MinLength: 1
    MaxLength: 40
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,39}$'
    Description: >
      Name for the IAM role. It is set explicitly rather than generated,
      because the role has to appear in its own trust policy condition and a
      predictable name keeps that readable.
      Capped at 40 characters and restricted to lowercase because the control
      bucket name is derived from it: name + '-ctl-' + 12-digit account ID must
      stay within the 63-character S3 limit. A longer name fails at bucket
      creation, several minutes into the stack, which is an unpleasant way to
      find out.
    ConstraintDescription: >
      1-40 characters, lowercase letters, digits and hyphens, starting with a
      letter or digit

  CreateControlBucket:
    Type: String
    Default: 'yes'
    AllowedValues: ['yes', 'no']
    Description: >
      Create a small native S3 bucket alongside the Access Point grant.
      Strongly recommended. Without a control that is expected to succeed,
      a failure against the Access Point cannot be told apart from a mistake
      in your own IAM setup - which is how this repository carried an
      incorrect blocker for three months.

  ControlBucketName:
    Type: String
    Default: ''
    Description: >
      Leave empty to get <role name>-ctl-<12-digit account id>, which stays
      inside the 63-character S3 limit for any allowed role name. Set it
      explicitly only if you need a particular name; S3 bucket names are global,
      so an explicit name may collide with someone else's.

Conditions:
  WantsControlBucket: !Equals [!Ref CreateControlBucket, 'yes']
  GenerateControlBucketName: !Equals [!Ref ControlBucketName, '']

Resources:

  # ---------------------------------------------------------------------------
  # The role Unity Catalog assumes.
  #
  # Unity Catalog requires the role to be able to assume itself. Naming the
  # role as its own principal fails at creation time with "Invalid principal",
  # because IAM validates that the principal already exists and the role is
  # still being created. The pattern below avoids the ordering problem: trust
  # the account root, then narrow it back to exactly this role with an
  # aws:PrincipalArn condition. The condition is what does the restricting, not
  # the principal, and it works in a single CloudFormation pass.
  #
  # This rests on aws:PrincipalArn resolving to the ROLE ARN rather than the
  # assumed-role session ARN. Verified 2026-08-12 by deploying this template,
  # assuming the role, and then assuming it again from those credentials:
  #   arn:aws:sts::<account>:assumed-role/<role>/hop1
  #     -> sts:AssumeRole on itself -> arn:aws:sts::<account>:assumed-role/<role>/selfhop
  # If that had returned AccessDenied, the condition would need to be
  # ArnLike on arn:aws:sts::<account>:assumed-role/<role>/* instead.
  # ---------------------------------------------------------------------------
  UnityCatalogStorageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >
        Databricks Unity Catalog storage credential for an FSx for ONTAP
        S3 Access Point. Managed by CloudFormation.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DatabricksControlPlaneAssume
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${DatabricksUnityCatalogAwsAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref DatabricksAccountId
          - Sid: SelfAssumeRequiredByUnityCatalog
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref DatabricksAccountId
                'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}'
      Policies:
        - PolicyName: fsxn-s3ap-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              # The access point ARN form. This is the one that was missing
              # when the registration appeared to be unsupported.
              - Sid: AccessPointArnForm
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                  - 's3:GetObjectTagging'
                  - 's3:PutObjectTagging'
                  - 's3:GetBucketLocation'
                  - 's3:ListBucketMultipartUploads'
                  - 's3:ListMultipartUploadParts'
                  - 's3:AbortMultipartUpload'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}'
                  - !Sub 'arn:${AWS::Partition}:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}/object/*'

              # The alias-as-bucket form. Granted as well because some clients
              # present the alias as an ordinary bucket name.
              - Sid: AliasAsBucketForm
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                  - 's3:GetObjectTagging'
                  - 's3:PutObjectTagging'
                  - 's3:GetBucketLocation'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${S3AccessPointAlias}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${S3AccessPointAlias}/*'

              - Sid: SelfAssume
                Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}'

        - !If
          - WantsControlBucket
          - PolicyName: native-s3-control-access
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: ControlBucket
                  Effect: Allow
                  Action:
                    - 's3:GetObject'
                    - 's3:PutObject'
                    - 's3:DeleteObject'
                    - 's3:ListBucket'
                    - 's3:GetObjectTagging'
                    - 's3:PutObjectTagging'
                    - 's3:GetBucketLocation'
                  Resource:
                    - !Sub
                      - 'arn:${AWS::Partition}:s3:::${Bucket}'
                      - Bucket: !If
                          - GenerateControlBucketName
                          - !Sub '${RoleName}-ctl-${AWS::AccountId}'
                          - !Ref ControlBucketName
                    - !Sub
                      - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                      - Bucket: !If
                          - GenerateControlBucketName
                          - !Sub '${RoleName}-ctl-${AWS::AccountId}'
                          - !Ref ControlBucketName
          - !Ref 'AWS::NoValue'
      Tags:
        - Key: Purpose
          Value: unity-catalog-storage-credential
        - Key: ManagedBy
          Value: cloudformation

  # ---------------------------------------------------------------------------
  # Native S3 control bucket. Seed it with tagged objects using
  # shared/scripts/probe_uc_external_location.py --seed-control before running
  # the comparison, so both sides of the test carry the same object tags.
  # ---------------------------------------------------------------------------
  ControlBucket:
    Type: AWS::S3::Bucket
    Condition: WantsControlBucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !If
        - GenerateControlBucketName
        - !Sub '${RoleName}-ctl-${AWS::AccountId}'
        - !Ref ControlBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          # A control bucket is scratch space for a verification run. Expiring
          # it keeps a forgotten stack from becoming a storage bill.
          - Id: expire-verification-objects
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Purpose
          Value: native-s3-control-for-uc-comparison
        - Key: ManagedBy
          Value: cloudformation

Outputs:

  RoleArn:
    Description: >
      Pass this to Databricks as the storage credential's IAM role ARN.
    Value: !GetAtt UnityCatalogStorageRole.Arn

  ExternalLocationUrl:
    Description: >
      The URL to register as the external location. The alias form is the only
      one Unity Catalog accepts; the ARN-style URL is rejected.
    Value: !Sub 's3://${S3AccessPointAlias}/'

  ControlExternalLocationUrl:
    Condition: WantsControlBucket
    Description: >
      Register this as a second external location and run the same query
      against it. If this one works and the Access Point one does not, the
      difference is on the platform side, not in your IAM setup.
    Value: !Sub
      - 's3://${Bucket}/control/'
      - Bucket: !If
          - GenerateControlBucketName
          - !Sub '${RoleName}-ctl-${AWS::AccountId}'
          - !Ref ControlBucketName

  ExternalIdUsed:
    Description: >
      The external ID this role trusts. It must match what Databricks reports
      for the storage credential. If Databricks shows something else, update
      the DatabricksAccountId parameter rather than editing the role by hand.
    Value: !Ref DatabricksAccountId

  NextStep:
    Description: Command that runs the registration and the comparison.
    Value: !Sub >-
      python3 shared/scripts/probe_uc_external_location.py --profile <databricks-cli-profile>
      --role-arn ${UnityCatalogStorageRole.Arn} --ap-alias ${S3AccessPointAlias}
      --ap-name ${S3AccessPointName} --region ${AWS::Region}
