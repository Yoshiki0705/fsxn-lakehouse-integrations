AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Databricks Unity Catalog integration with FSx for NetApp ONTAP via S3 Access Point.
  Creates S3 AP (VPC-scoped), IAM Role for Databricks cross-account access,
  and VPC Endpoint for private connectivity.

Parameters:
  EnvironmentName:
    Type: String
    Default: fsxn-lakehouse
    Description: Environment name prefix for resource naming

  S3BucketName:
    Type: String
    Description: >
      FSx for ONTAP SVM S3 bucket name (the bucket exposed by ONTAP S3 server).
      Format: svm-name or custom bucket name configured on SVM.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where Databricks workspace and FSx for ONTAP reside

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for S3 Interface VPC Endpoint

  DatabricksAccountId:
    Type: String
    Description: >
      Databricks AWS Account ID for cross-account trust.
      Default is Databricks' standard AWS account for Unity Catalog.
    Default: '123456789012'

  DatabricksWorkspaceId:
    Type: String
    Description: Databricks Workspace ID (numeric)

  ExternalId:
    Type: String
    Description: >
      External ID for IAM role trust (from Databricks Storage Credential setup).
      This prevents confused deputy attacks.

  S3AccessPointName:
    Type: String
    Default: fsxn-databricks-ap
    Description: Name for the S3 Access Point

  AllowedPrefixes:
    Type: CommaDelimitedList
    Default: 'bronze/*,silver/*,gold/*'
    Description: Allowed S3 key prefixes (comma-separated)

  EnableVpcEndpoint:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Whether to create S3 Interface VPC Endpoint

Conditions:
  CreateVpcEndpoint: !Equals [!Ref EnableVpcEndpoint, 'true']

Resources:
  # ============================================================
  # S3 Access Point for Databricks
  # ============================================================
  DatabricksAccessPoint:
    Type: AWS::S3::AccessPoint
    Properties:
      Name: !Ref S3AccessPointName
      Bucket: !Ref S3BucketName
      VpcConfiguration:
        VpcId: !Ref VpcId
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDatabricksRoleAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt DatabricksS3AccessRole.Arn
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
              - 's3:ListBucketMultipartUploads'
              - 's3:ListMultipartUploadParts'
              - 's3:AbortMultipartUpload'
              - 's3:CreateMultipartUpload'
              - 's3:UploadPart'
              - 's3:CompleteMultipartUpload'
            Resource:
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}'
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}/object/*'
            Condition:
              StringEquals:
                's3:AccessPointNetworkOrigin': VPC
                'aws:SourceVpc': !Ref VpcId

  # ============================================================
  # IAM Role for Databricks (Cross-Account AssumeRole)
  # ============================================================
  DatabricksS3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-databricks-s3-role'
      Description: >
        IAM Role assumed by Databricks Unity Catalog to access FSx for ONTAP via S3 AP.
        Trust policy allows Databricks AWS account with external ID.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDatabricksAssumeRole
            Effect: Allow
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${DatabricksAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
          # Self-assume for Unity Catalog credential passthrough
          - Sid: AllowSelfAssumeRole
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-databricks-s3-role'
        - Key: Project
          Value: fsxn-lakehouse-integrations
        - Key: Integration
          Value: databricks

  # ============================================================
  # IAM Policy for S3 AP Access
  # ============================================================
  DatabricksS3AccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-databricks-s3ap-access'
      Roles:
        - !Ref DatabricksS3AccessRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3APAccess
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
              - 's3:ListBucketMultipartUploads'
              - 's3:ListMultipartUploadParts'
              - 's3:AbortMultipartUpload'
              - 's3:CreateMultipartUpload'
              - 's3:UploadPart'
              - 's3:CompleteMultipartUpload'
            Resource:
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}'
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}/object/*'
          - Sid: AllowBucketLevelOps
            Effect: Allow
            Action:
              - 's3:GetBucketLocation'
              - 's3:ListBucket'
            Resource:
              - !Sub 'arn:aws:s3:::${S3BucketName}'

  # ============================================================
  # S3 Interface VPC Endpoint (for private access)
  # ============================================================
  S3InterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Interface
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref S3EndpointSecurityGroup
      PrivateDnsEnabled: false
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDatabricksS3APAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt DatabricksS3AccessRole.Arn
            Action:
              - 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}'
              - !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}/object/*'

  S3EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateVpcEndpoint
    Properties:
      GroupDescription: Security group for S3 Interface VPC Endpoint (Databricks)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
          Description: HTTPS from VPC (adjust CIDR to match your VPC)
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-databricks-s3-endpoint-sg'
        - Key: Project
          Value: fsxn-lakehouse-integrations
        - Key: Integration
          Value: databricks

Outputs:
  DatabricksRoleArn:
    Description: >
      IAM Role ARN for Databricks Storage Credential.
      Use this value when creating the Storage Credential in Databricks.
    Value: !GetAtt DatabricksS3AccessRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-DatabricksRoleArn'

  S3AccessPointArn:
    Description: S3 Access Point ARN
    Value: !Sub 'arn:aws:s3:${AWS::Region}:${AWS::AccountId}:accesspoint/${S3AccessPointName}'
    Export:
      Name: !Sub '${EnvironmentName}-DatabricksS3APArn'

  S3AccessPointAlias:
    Description: >
      S3 Access Point Alias. Use this as the "bucket" in S3 API calls.
      Format: <name>-<account-id>.s3-accesspoint.<region>.amazonaws.com
    Value: !GetAtt DatabricksAccessPoint.Alias
    Export:
      Name: !Sub '${EnvironmentName}-DatabricksS3APAlias'

  ExternalLocationUrl:
    Description: >
      URL to use for Databricks External Location.
      Format: s3://<access-point-alias>/
    Value: !Sub 's3://${DatabricksAccessPoint.Alias}/'

  VpcEndpointId:
    Condition: CreateVpcEndpoint
    Description: S3 Interface VPC Endpoint ID
    Value: !Ref S3InterfaceEndpoint
