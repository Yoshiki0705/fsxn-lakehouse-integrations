industry: energy
display_name: "Energy & Utilities (エネルギー・ユーティリティ)"
aws_industry_team: "Energy & Utilities"
file_types:
  - extension: ".pdf"
    category: "inspection_report"
    ai_classification: "点検レポート/風力タービン"
    sample_content: "Equipment: WTG-042, Component: Blade, Defect: Minor crack, Severity: Medium, Action: Scheduled maintenance"
    count: 30
  - extension: ".csv"
    category: "scada_log"
    ai_classification: "SCADAログ/変電所"
    sample_content: "Station: SUB-A7, Records: 86400, Anomalies: 3, Date: 2026-06-01"
    count: 20
  - extension: ".jpg"
    category: "equipment_photo"
    ai_classification: "設備写真/欠陥"
    sample_content: "Equipment: WTG-042, Component: Blade 3, Defect: Edge erosion, Severity: Medium"
    count: 40
  - extension: ".pdf"
    category: "compliance_filing"
    ai_classification: "コンプライアンス申告/NERC"
    sample_content: "Regulation: NERC CIP, Period: Q2 2026, Status: Submitted, Deadline: 2026-07-15"
    count: 10
  - extension: ".pdf"
    category: "work_order"
    ai_classification: "作業指示書/是正"
    sample_content: "Equipment: WTG-042, Type: Corrective, Component: Blade, Priority: Medium, Due: 2026-06-15"
    count: 25
metadata_fields:
  - name: "equipment_id"
    type: "string"
    example: "WTG-042"
  - name: "component"
    type: "string"
    example: "Blade"
  - name: "severity"
    type: "string"
    example: "Medium"
  - name: "action_required"
    type: "string"
    example: "Scheduled maintenance"
  - name: "inspection_date"
    type: "date"
    example: "2026-06-01"
queries:
  - name: "Critical equipment defects requiring action"
    sql: "SELECT * FROM metadata WHERE ai_classification LIKE 'Inspection%' AND severity IN ('High', 'Critical') AND action_required != 'Completed'"
  - name: "SCADA anomalies correlated with inspections"
    sql: "SELECT * FROM metadata WHERE ai_classification LIKE 'SCADA%' AND anomaly_count > 0 ORDER BY event_time DESC"
  - name: "Compliance filing deadlines"
    sql: "SELECT * FROM metadata WHERE ai_classification LIKE 'Compliance Filing%' ORDER BY deadline ASC"
  - name: "Equipment maintenance history"
    sql: "SELECT * FROM metadata WHERE equipment_id = 'WTG-042' ORDER BY scan_timestamp DESC"
