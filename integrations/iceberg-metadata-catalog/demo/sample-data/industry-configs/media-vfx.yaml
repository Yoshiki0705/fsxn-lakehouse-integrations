industry: media-vfx
display_name: "Media & VFX (メディア/VFX)"
file_types:
  - extension: ".exr"
    category: "final_composite"
    ai_classification: "ファイナルコンポジット"
    sample_content: "Shot: 010, Version: v003, Status: Final, Resolution: 4096x2160, Color: ACEScg"
    count: 25
  - extension: ".hdr"
    category: "hdri_environment"
    ai_classification: "HDRI 環境"
    sample_content: "Type: Outdoor/Forest, Resolution: 8192x4096, Dynamic Range: 20 stops"
    count: 10
  - extension: ".png"
    category: "character_texture"
    ai_classification: "キャラクターテクスチャ"
    sample_content: "Character: Dragon, Map: Diffuse, Resolution: 4096x4096, UV Set: UDIM"
    count: 15
  - extension: ".dpx"
    category: "plate_scan"
    ai_classification: "プレートスキャン"
    sample_content: "Camera: ARRI ALEXA, Shot: 010, Take: 3, Frame: 1001-1120"
    count: 20
  - extension: ".mov"
    category: "previs"
    ai_classification: "プレビズ"
    sample_content: "Sequence: Act 2, Version: v05, Duration: 02:30, Status: Review"
    count: 8
metadata_fields:
  - name: "project"
    type: "string"
    example: "PROD-2026"
  - name: "shot"
    type: "string"
    example: "010"
  - name: "version"
    type: "string"
    example: "v003"
  - name: "status"
    type: "string"
    example: "Final"
  - name: "department"
    type: "string"
    example: "Compositing"
  - name: "resolution"
    type: "string"
    example: "4096x2160"
  - name: "color_space"
    type: "string"
    example: "ACEScg"
queries:
  - name: "Shot completion status"
    sql: "SELECT shot, count(case when status='Final' then 1 end) as final, count(case when status='WIP' then 1 end) as wip FROM metadata WHERE project='PROD-2026' GROUP BY shot"
  - name: "Latest versions per shot"
    sql: "SELECT * FROM metadata WHERE project='PROD-2026' AND shot='010' ORDER BY version DESC"
  - name: "Storage by department and status"
    sql: "SELECT department, status, count(*), sum(file_size_bytes)/(1024*1024*1024) as gb FROM metadata GROUP BY department, status"
  - name: "HDRI environments at 4K+ resolution"
    sql: "SELECT * FROM metadata WHERE ai_classification = 'HDRI 環境' AND resolution >= '4096'"
limitations:
  - "Large files (10MB+) cost ~$0.15/file for Bedrock classification"
  - "Binary formats (EXR, DPX) classified primarily by filename/path - limited content analysis"
  - "Very large files (>500MB) may exceed Lambda memory limits"
  - "Metadata extraction depends heavily on consistent file/folder naming conventions"
  - "VFX projects with millions of frames can accumulate significant classification costs"
