industry: education
display_name: "Education & Research (教育・研究)"
aws_industry_team: "Public Sector"
file_types:
  - extension: ".pdf"
    category: "research_paper"
    ai_classification: "研究論文"
    sample_content: "Topic: ML/Transformer, Venue: ICML 2026, Funding: JST CREST, Authors: 3"
    count: 40
  - extension: ".pdf"
    category: "thesis_document"
    ai_classification: "学位論文/ドラフト"
    sample_content: "Student: Tanaka, Chapter: 4, Version: 3, Status: In Progress, Committee: 3 members"
    count: 20
  - extension: ".pdf"
    category: "grant_proposal"
    ai_classification: "研究費申請"
    sample_content: "Agency: JST CREST, Amount: ¥150M, Duration: 5 years, PI: Prof. Suzuki"
    count: 15
  - extension: ".json"
    category: "lecture_metadata"
    ai_classification: "講義メタデータ"
    sample_content: "Course: CS401, Week: 12, Topic: Attention Mechanisms, Duration: 90min, Students: 45"
    count: 30
  - extension: ".md"
    category: "dataset_documentation"
    ai_classification: "データセット文書"
    sample_content: "Dataset: Sentiment Analysis v2, Records: 50000, License: CC-BY-4.0, Format: CSV"
    count: 25
metadata_fields:
  - name: "department"
    type: "string"
    example: "Computer Science"
  - name: "topic"
    type: "string"
    example: "ML/Transformer"
  - name: "funding_source"
    type: "string"
    example: "JST CREST"
  - name: "publication_status"
    type: "string"
    example: "Published"
  - name: "academic_year"
    type: "string"
    example: "2026"
queries:
  - name: "Research output by department and funding"
    sql: "SELECT department, funding_source, COUNT(*) as papers FROM metadata WHERE ai_classification = 'Research Paper' GROUP BY department, funding_source"
  - name: "Grant proposals approaching deadline"
    sql: "SELECT * FROM metadata WHERE ai_classification = 'Grant Proposal' AND deadline < current_date + interval '60' day ORDER BY deadline"
  - name: "Thesis progress by student"
    sql: "SELECT student_name, MAX(chapter) as latest_chapter, MAX(version) as latest_version FROM metadata WHERE ai_classification LIKE 'Thesis%' GROUP BY student_name"
  - name: "Datasets by license type"
    sql: "SELECT license_type, COUNT(*) as datasets FROM metadata WHERE ai_classification = 'Dataset Documentation' GROUP BY license_type"
