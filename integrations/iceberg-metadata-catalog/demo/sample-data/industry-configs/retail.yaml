industry: retail
display_name: "Retail & Consumer Goods (小売・流通)"
aws_industry_team: "Retail & CPG"
file_types:
  - extension: ".pdf"
    category: "planogram"
    ai_classification: "プラノグラム/フロアレイアウト"
    sample_content: "Department: Electronics, Season: Q2 2026, Version: 3, Format: Standard 1200sqm"
    count: 25
  - extension: ".jpg"
    category: "product_image"
    ai_classification: "商品画像"
    sample_content: "SKU: 88421, Angle: Front, Background: White, Resolution: 4K"
    count: 50
  - extension: ".pdf"
    category: "supplier_contract"
    ai_classification: "サプライヤー契約書"
    sample_content: "Vendor: VND-0187, Category: Fresh Produce, Term: 2026-2027"
    count: 15
  - extension: ".csv"
    category: "pos_export"
    ai_classification: "POS データエクスポート"
    sample_content: "Date: 2026-06-01, Store: TKY-042, Transactions: 12400, Revenue: ¥8,234,500"
    count: 30
  - extension: ".pdf"
    category: "compliance_certificate"
    ai_classification: "コンプライアンス証明書"
    sample_content: "Vendor: VND-0187, Type: Food Safety, Expiry: 2027-03-31"
    count: 10
metadata_fields:
  - name: "department"
    type: "string"
    example: "Electronics"
  - name: "season"
    type: "string"
    example: "Q2-2026"
  - name: "supplier_id"
    type: "string"
    example: "VND-0187"
  - name: "sku_id"
    type: "string"
    example: "SKU-88421"
  - name: "expiry_date"
    type: "date"
    example: "2027-03-31"
queries:
  - name: "Current season planograms by department"
    sql: "SELECT * FROM metadata WHERE ai_classification = 'Planogram/Floor Layout' AND season = 'Q2-2026' ORDER BY department"
  - name: "Expired supplier certifications"
    sql: "SELECT * FROM metadata WHERE ai_classification = 'Compliance Certificate' AND expiry_date < current_date"
  - name: "SKUs with missing product images"
    sql: "SELECT sku_id, COUNT(*) as image_count FROM metadata WHERE ai_classification LIKE 'Product Image%' GROUP BY sku_id HAVING COUNT(*) < 3"
  - name: "Daily POS exports by store"
    sql: "SELECT * FROM metadata WHERE ai_classification = 'POS Data Export' AND scan_date = current_date ORDER BY store_id"
