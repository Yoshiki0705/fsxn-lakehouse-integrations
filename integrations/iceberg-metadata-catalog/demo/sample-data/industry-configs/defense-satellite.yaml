industry: defense-satellite
display_name: "Defense & Satellite (防衛・衛星)"
aws_industry_team: "Public Sector"
file_types:
  - extension: ".json"
    category: "imagery_metadata"
    ai_classification: "画像メタデータ/海上監視"
    sample_content: "Satellite: SAT-04, Region: Coastal-A, Resolution: 0.5m, Spectral: 8-band, Cloud: 12%"
    count: 50
  - extension: ".csv"
    category: "mission_log"
    ai_classification: "ミッションログ/テレメトリ"
    sample_content: "Satellite: SAT-04, DataPoints: 86400, Health: Normal, Orbit: Nominal"
    count: 30
  - extension: ".pdf"
    category: "anomaly_report"
    ai_classification: "異常報告"
    sample_content: "Satellite: SAT-04, Subsystem: Thermal, Severity: Warning, Duration: 12min"
    count: 15
  - extension: ".json"
    category: "document_index"
    ai_classification: "文書インデックス"
    sample_content: "Region: A, Quarter: Q2-2026, Documents: 142, Classification: Restricted"
    count: 10
  - extension: ".pdf"
    category: "orbit_plan"
    ai_classification: "軌道計画/マヌーバ"
    sample_content: "Satellite: SAT-04, Type: Station-keeping, Date: 2026-06-02, DeltaV: 0.3m/s"
    count: 12
metadata_fields:
  - name: "satellite_id"
    type: "string"
    example: "SAT-04"
  - name: "region"
    type: "string"
    example: "Coastal-A"
  - name: "resolution_m"
    type: "string"
    example: "0.5"
  - name: "observation_type"
    type: "string"
    example: "Maritime surveillance"
  - name: "classification_level"
    type: "string"
    example: "Restricted"
queries:
  - name: "Recent sub-meter imagery by region"
    sql: "SELECT * FROM metadata WHERE ai_classification LIKE 'Imagery Meta%' AND resolution_m <= 1.0 AND capture_time > current_timestamp - interval '72' hour"
  - name: "Satellite anomalies in last 30 days"
    sql: "SELECT * FROM metadata WHERE ai_classification = 'Anomaly Report' AND scan_timestamp > current_date - interval '30' day ORDER BY severity DESC"
  - name: "Observation coverage by region"
    sql: "SELECT region, COUNT(*) as passes, MAX(capture_time) as latest FROM metadata WHERE ai_classification LIKE 'Imagery Meta%' GROUP BY region"
  - name: "Upcoming orbit maneuvers"
    sql: "SELECT * FROM metadata WHERE ai_classification LIKE 'Orbit Plan%' AND maneuver_date > current_date ORDER BY maneuver_date"
