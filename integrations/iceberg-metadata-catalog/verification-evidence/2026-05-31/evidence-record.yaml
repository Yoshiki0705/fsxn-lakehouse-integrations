# Issues Encountered and Resolved
issues:
  - issue: "S3 Tables create-table with --format ICEBERG creates empty table without schema"
    resolution: "Use PyIceberg catalog.create_table() with explicit schema definition"
  - issue: "PyArrow map type default has nullable values, Iceberg requires non-nullable"
    resolution: "Use pa.field('value', pa.string(), nullable=False) in map type definition"
  - issue: "Athena returns CATALOG_NOT_FOUND for s3tablescatalog"
    resolution: "Register federated catalog: aws glue create-catalog --name s3tablescatalog"
  - issue: "Athena returns COLUMN_NOT_FOUND after catalog registration"
    resolution: "Grant Lake Formation SELECT + DESCRIBE permissions on the table"
