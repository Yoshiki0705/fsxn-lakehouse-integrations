# =============================================================================
# Test I-1: Idempotency (Duplicate Write)
# =============================================================================
test_I1_idempotency:
  status: "KNOWN_BEHAVIOR"
  description: "Same file_id written twice → both records appended (Iceberg append-only)"
  input: "Same FPolicy create event sent twice"
  result:
    records_in_table: 2
    file_id: "a0a90c6c-6f36-5ea5-8ce8-37b6b9ece5dd"
    file_name: "idempotent-test.png"
  conclusion: |
    Iceberg append-only design means duplicate events create duplicate records.
    This is by design — S3 Tables auto-compaction will merge, and query-side
    deduplication (ROW_NUMBER() OVER PARTITION BY file_id ORDER BY modified_at DESC)
    handles this correctly. SQS exactly-once delivery is not guaranteed, so
    this behavior is expected and acceptable.
  recommendation: "Add ROW_NUMBER dedup to Athena named queries for production use"

# =============================================================================
# Test I-2: Concurrent Writes (10 parallel Lambda invocations)
# =============================================================================
test_I2_concurrent_writes:
  status: "KNOWN_BEHAVIOR"
  description: "10 parallel Lambda invocations → 8 failed with commit conflict, 2 succeeded"
  input: "10 concurrent Lambda invoke with different file_paths"
  result:
    total_invocations: 10
    succeeded: 2
    failed_with_conflict: 8
    error: "Iceberg commit conflict (concurrent append to same table)"
  conclusion: |
    S3 Tables Iceberg does not support concurrent writers to the same table
    without conflict resolution. This is expected Iceberg behavior.
    The correct design is: SQS batching (multiple messages per Lambda invocation)
    rather than parallel Lambda executions. SQS ReportBatchItemFailures ensures
    failed messages are retried and eventually processed.
  recommendation: |
    - Use SQS batch size 10-50 with MaxBatchingWindow 30s
    - Avoid parallel Lambda invocations to the same Iceberg table
    - SQS retry mechanism handles conflicts automatically
  design_impact: "Validates SQS batching design decision (not fan-out)"

