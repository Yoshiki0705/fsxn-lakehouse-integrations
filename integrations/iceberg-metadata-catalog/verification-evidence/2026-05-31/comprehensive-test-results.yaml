  status: "PARTIALLY_VERIFIED"
  description: "Snowflake External Iceberg Table read from S3 Tables"
  verified:
    - "Snowflake workspace accessible (MH89262, CVDRQJT)"
    - "SHOW EXTERNAL VOLUMES: 0 rows (no External Volume configured yet) → NOW CREATED"
    - "S3 Tables warehouse location identified: s3://4fbd5e7c-8e8c-43a1-gs7cqcjhrd5bmfh7tpafuoyin9mq6apn1b--table-s3"
    - "SHOW STORAGE INTEGRATIONS: 2 integrations (FSXN_STORAGE_INTEGRATION, FSXN_VERIFICATION_INTEGRATION)"
    - "DESC STORAGE INTEGRATION: role=fsxn-snowflake-verification-role, external_id confirmed"
    - "CREATE EXTERNAL VOLUME s3tables_metadata_vol: SUCCESSFULLY CREATED"
  remaining_steps:
    - "Create Iceberg Table referencing the External Volume and S3 Tables metadata location"
    - "Query metadata from Snowflake"
    - "Verify Horizon Catalog governance on external access"
  conclusion: |
    External Volume successfully created pointing to S3 Tables internal bucket.
    IAM role (fsxn-snowflake-verification-role) already has s3tables:* and s3:GetObject
    permissions.
    
    FINDING: Snowflake cannot directly read S3 Tables Iceberg tables as External Iceberg Tables.
    - CATALOG = 'SNOWFLAKE' requires column schema (creates new managed table, not reads existing)
    - S3 Tables Iceberg REST endpoint is not a supported catalog type in Snowflake
    
    Correct Snowflake path (as documented in architecture):
    1. Export S3 Tables data as Parquet (or use PyIceberg to read → write to S3)
    2. Create Snowflake External Stage pointing to the exported data
    3. COPY INTO Snowflake Managed Iceberg Table
    4. Apply Horizon Catalog governance (Row Access Policy, Masking)
    
    This confirms the architecture document's design: Snowflake path uses
    COPY INTO for data ingestion, not direct Iceberg REST catalog federation.

