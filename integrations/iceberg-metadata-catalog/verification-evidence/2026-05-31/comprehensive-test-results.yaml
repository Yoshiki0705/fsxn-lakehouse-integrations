    - "CREATE CONNECTION TYPE iceberg_rest with S3 Tables endpoint"
    - "CREATE FOREIGN CATALOG using the connection"
    - "Query metadata table via Spark SQL"
  blocker: |
    S3 Tables Iceberg REST endpoint requires SigV4 authentication.
    Databricks needs an IAM role with s3tables:* permissions configured
    as a Storage Credential or Instance Profile. This is a configuration
    task, not a technical blocker.
    
    UPDATE: After testing, Databricks SQL Warehouse (Serverless) does NOT support:
    - CREATE CONNECTION TYPE iceberg_rest (not in supported types list)
    - CREATE CONNECTION TYPE GLUE for AWS Glue Catalog federation
    
    The only viable path is Spark cluster with manual Iceberg REST catalog config.
    IAM policies have been added to both databricks-cross-account-role and
    fsxn-snowflake-verification-role for s3tables:* and s3:GetObject on table buckets.
  conclusion: |
    Databricks workspace is fully operational and ready for External Catalog
    configuration. The Serverless Starter Warehouse can execute SQL immediately.
    
    CRITICAL FINDING: CREATE CONNECTION TYPE iceberg_rest is NOT SUPPORTED
    on this Databricks workspace (Premium tier, ap-northeast-1).
    Error: [CONNECTION_TYPE_NOT_SUPPORTED] Cannot create connection of type 'iceberg_rest'.
    
    Alternative approach required:
    1. Use Spark cluster with Iceberg REST Catalog configured in spark-defaults.conf
    2. Or wait for Databricks to add iceberg_rest as a supported connection type
    3. Or use Databricks Lakehouse Federation with Glue Catalog (S3 Tables registered in Glue)
    
    The Glue Catalog approach (s3tablescatalog federated catalog) is already working
    with Athena and could be accessed from Databricks via the Glue connection type.

