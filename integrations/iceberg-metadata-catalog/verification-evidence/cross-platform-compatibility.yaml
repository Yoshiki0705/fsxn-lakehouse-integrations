# =============================================================================
# Cross-Platform Compatibility — Tested Paths
# =============================================================================
# Purpose: Document exactly what was tested, what worked, and what didn't
# This separates "platform capability" from "our tested path"
# =============================================================================

tested_date: "2026-05-31"
region: "ap-northeast-1"

review_policy:
  revalidate_after_days: 90
  last_reviewed: "2026-06-01"
  next_review_due: "2026-08-30"
  reason: "Databricks/Snowflake/S3 Tables interoperability evolves rapidly"

platforms:
  aws:
    tested_paths:
      - name: "Athena via S3 Tables federated catalog (s3tablescatalog)"
        result: "verified"
        capabilities:
          read_select: verified
          time_travel: verified
          append_write: "not tested via Athena (PyIceberg used)"
          metadata_tables: verified
          lake_formation_table_grant: verified
          lake_formation_column_grant: observed_limitation
        notes: "Sub-2-second queries, Lake Formation table-level grants work"
      - name: "PyIceberg via S3 Tables REST endpoint"
        result: "verified"
        capabilities:
          read_select: verified
          time_travel: verified
          append_write: verified
          metadata_tables: verified
          lake_formation_table_grant: "via Athena"
          lake_formation_column_grant: observed_limitation
        notes: "Read/write/append all work. Used for initial scan and enrichment"
      - name: "Lake Formation table-level SELECT/DESCRIBE"
        result: "verified"
        notes: "Grant/revoke works correctly"
      - name: "Lake Formation column-level (ColumnWildcard + ExcludedColumnNames)"
        result: "observed_limitation"
        tested_date: "2026-06-01"
        error: "InvalidInputException: Permissions modification is invalid (with account prefix); ExcludedColumnNames silently ignored (without prefix)"
        notes: "AWS docs describe column-level support for S3 Tables. Failed on both tested CatalogId formats. Re-tested 2026-06-01 — confirmed not working on this federated catalog path."
      - name: "AWS Glue Iceberg REST endpoint (glue.<region>.amazonaws.com/iceberg)"
        result: "verified"
        tested_date: "2026-06-01"
        notes: "Successfully connected via PyIceberg. warehouse='<ACCOUNT_ID>:s3tablescatalog/fsxn-metadata-catalog'. Recommended for production with Lake Formation."

  databricks:
    tested_paths:
      - name: "SQL Warehouse CREATE CONNECTION TYPE iceberg_rest to S3 Tables REST"
        result: "CONNECTION_TYPE_NOT_SUPPORTED"
        status: "observed_limitation"
        notes: "Does not mean Databricks lacks Iceberg REST support — UC provides its own Iceberg REST endpoint"
      - name: "UC Iceberg REST Catalog audit logging for external engines"
        result: "verified"
        tested_date: "2026-06-01"
        status: "confirmed"
        notes: "External engine access logged in system.access.audit under uniformIcebergRestCatalog. Credential vending logged as loadTableCredentials. Confirmed by Databricks support."
      - name: "Spark cluster + Iceberg REST catalog + SigV4 to S3 Tables"
        result: "NO_SUCH_CATALOG_EXCEPTION"
        tested_date: "2026-06-01"
        status: "blocked_by_unity_catalog"
        notes: "Unity Catalog controls catalog registration. spark.conf.set and cluster Spark config both fail. UC Foreign Catalog is the required path."
      - name: "Delta Sharing via S3 Access Point"
        result: "not_supported"
        tested_date: "2026-06-01"
        status: "confirmed_limitation"
        notes: "Delta Sharing server uses the same UC storage credentials. Cannot bypass S3 AP session policy. Confirmed by Databricks support."
      - name: "Delta Sharing via DataSync → S3 → UC External Delta Table"
        result: "supported"
        tested_date: "2026-06-01"
        status: "confirmed_workaround"
        notes: "DataSync to standard S3 bucket → UC External Location → External Delta Table → Share. Delta format required (Parquet/ORC must be converted). Not applicable to Iceberg tables without conversion."
      - name: "NFS mount path as UC External Volume"
        result: "not_supported"
        tested_date: "2026-06-01"
        status: "confirmed_limitation"
        notes: "UC External Volumes require cloud storage URIs (s3://, abfss://, gs://). NFS/FUSE mount paths not supported. Internal feature request (AHA) exists for EFS/NFS via UC. Confirmed by Databricks support."
      - name: "Unity Catalog Foreign Iceberg for S3 Tables"
        result: "not_tested"
        status: "track_support"
        notes: "UC supports Foreign Iceberg; verify compatibility with S3 Tables via Glue REST. Follow-up question submitted to Databricks support (2026-06-01). NOTE: Databricks docs state 'Credential vending on Foreign Iceberg tables is not supported' and tables are not auto-refreshed. Catalog federation with AWS Glue (Hive Metastore type) is also available."
      - name: "AWS Glue Catalog Federation with Databricks UC"
        result: "not_tested"
        status: "strategic_alternative"
        notes: "AWS docs describe Glue → UC federation for Iceberg tables"

  snowflake:
    tested_paths:
      - name: "External Iceberg Table with S3 Tables REST endpoint as catalog"
        result: "not_supported_catalog_type"
        status: "observed_limitation"
        notes: "S3 Tables REST is not in Snowflake's supported catalog type list"
      - name: "Glue Iceberg REST integration (ICEBERG_REST + AWS_GLUE + VENDED_CREDENTIALS)"
        result: "confirmed_incompatible"
        tested_date: "2026-06-02"
        status: "blocked"
        notes: |
          CATALOG INTEGRATION created successfully. DESCRIBE returns valid IAM credentials.
          CREATE ICEBERG TABLE fails with Error 004174 (credential vending).
          ROOT CAUSE CONFIRMED by both sides (2026-06-02):
          - Snowflake Support confirmed: VENDED_CREDENTIALS requires loadTable response to include
            s3.access-key-id, s3.secret-access-key, s3.session-token in config map.
          - Our loadTable test confirmed: these fields are ABSENT from Glue REST response
            (even with X-Iceberg-Access-Delegation: vended-credentials header).
          - Glue REST /credentials endpoint returns UnknownOperationException.
          - Snowflake states no known Snowflake-side issues — problem is AWS Glue REST not vending credentials.
          ALTERNATIVE: Object Store catalog integration (read metadata file directly, manual refresh).
      - name: "Object Store catalog integration (read metadata file directly)"
        result: "access_denied"
        tested_date: "2026-06-02"
        status: "blocked"
        notes: |
          Tested with correct S3 Tables internal bucket path and External Volume.
          AssumeRole succeeds but Snowflake receives 'access denied' when attempting
          to read metadata file. IAM role can read the file directly (verified via CLI),
          but Snowflake's access pattern (likely includes ListBucket or other operations)
          is blocked by S3 Tables internal bucket restrictions.
          S3 Tables internal buckets block ListObjectsV2 (MethodNotAllowed) — Snowflake
          likely requires this operation during table creation/metadata resolution.
          CONCLUSION: Object Store catalog is NOT viable for S3 Tables internal buckets.
          Metadata must be exported to a standard S3 bucket first.
      - name: "Snowflake Open Catalog (Polaris) as Iceberg catalog"
        result: "not_tested"
        status: "strategic_alternative"
        notes: "Polaris is GA. Could serve as catalog for new metadata tables"
      - name: "COPY INTO from S3 export of metadata"
        result: "available"
        status: "workaround"
        notes: "Works but negates zero-copy for metadata. Raw files stay on FSx"
      - name: "Metadata sync to Snowflake for Cortex Search / Intelligence"
        result: "not_tested"
        status: "recommended_activation_pattern"
        notes: "Sync redacted metadata only; raw files remain on FSx"
      - name: "TO_FILE with S3 Access Point-backed External Stage"
        result: "verified"
        tested_date: "2026-06-02"
        status: "working"
        notes: |
          TO_FILE works correctly with S3 AP stages when using:
          (1) String literal syntax: TO_FILE('@DB.SCHEMA.STAGE', 'path/to/file')
          (2) Correct file path that exists on the stage.
          Original failures were due to (a) identifier syntax instead of string literal,
          and (b) referencing non-existent file '_sample.png'.
          Confirmed working with 'athena-results/athena-s3cp-test.txt' (8.0s, Claude Sonnet 4.5).
          This means AI multimodal (Cortex COMPLETE) can read files from FSx for ONTAP via S3 AP.
      - name: "SYSTEM$VERIFY_CATALOG_INTEGRATION for Glue REST"
        result: "verified"
        tested_date: "2026-06-02"
        status: "healthy"
        notes: "Returns 'Statement executed successfully'. Confirms Snowflake ↔ Glue REST connectivity and authentication are healthy. Failure is only at credential vending step."
