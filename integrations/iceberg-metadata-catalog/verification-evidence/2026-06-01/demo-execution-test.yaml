# =============================================================================
# Bug Fix: SIGPIPE in run-demo.sh
# =============================================================================
bugfix_sigpipe:
  status: "FIXED"
  description: "run-demo.sh exited with code 255 due to SIGPIPE from 'head -30' pipe"
  root_cause: |
    `set -euo pipefail` causes script to exit when `aws athena get-query-results | head -30`
    triggers SIGPIPE (head closes pipe after 30 lines, aws CLI gets SIGPIPE).
  fix: "Added '|| true' after the piped command to suppress SIGPIPE exit"
  verification: "Full demo now completes all 8 steps with exit code 0"

