# FSx for ONTAP S3 Access Point — Hive Connector
# Trino uses its own S3 filesystem for s3:// URIs
connector.name=hive

# File-based metastore (no external Hive Metastore needed)
hive.metastore=file
hive.metastore.catalog.dir=file:///tmp/trino-metastore

# S3 Access Point configuration
hive.s3.path-style-access=true
hive.s3.endpoint=https://s3.ap-northeast-1.amazonaws.com
hive.s3.region=ap-northeast-1

# Credentials: use environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# Or set explicitly:
# hive.s3.aws-access-key=<key>
# hive.s3.aws-secret-key=<secret>

# Performance
hive.s3.max-connections=50
hive.s3.multipart.min-file-size=16MB
