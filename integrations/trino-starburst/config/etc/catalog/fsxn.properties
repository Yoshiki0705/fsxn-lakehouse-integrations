# FSx for ONTAP S3 Access Point — Hive Connector (Trino 438, legacy S3 support)
connector.name=hive

# File-based metastore
hive.metastore=file
hive.metastore.catalog.dir=file:///tmp/trino-metastore

# Legacy S3 configuration (works with Trino <= 438)
hive.s3.path-style-access=true
hive.s3.endpoint=https://s3.ap-northeast-1.amazonaws.com
hive.s3.region=ap-northeast-1
