# S3 Tables via AWS Glue Iceberg REST endpoint
# Trino 481 — Iceberg REST catalog
# Date: 2026-06-01
# IMPORTANT: Glue REST does NOT support credential vending
# Trino uses its own IAM credentials (env vars) for both metadata and data access
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=https://glue.ap-northeast-1.amazonaws.com/iceberg
iceberg.rest-catalog.warehouse=catalogs/<ACCOUNT_ID>:s3tablescatalog/fsxn-metadata-catalog
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.region=ap-northeast-1
